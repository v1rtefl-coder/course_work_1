[project]
name = "course-work-1"
version = "0.1.0"
description = ""
authors = [
    {name = "Chubarov Ilya",email = "i-chubarov@mail.ru"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.lint.dependencies]
flake8 = "^7.3.0"
mypy = "^1.19.1"
black = "^26.1.0"
isort = "^7.0.0"
pytest = "^9.0.2"
requests = "^2.32.5"

[tool.mypy]
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
exclude = 'venv'

[tool.black]
line-length = 119
exclude = '''.git'''

[tool.isort]
line_length = 119
